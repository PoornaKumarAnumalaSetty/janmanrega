spring:
  application:
    name: janmanrega-dashboard
  
  datasource:
    url: jdbc:postgresql://localhost:5432/janmanrega
    username: postgres
    password: Setty@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true

  cache:
    type: simple
    cache-names:
      - districts
      - district-performance
      - dashboard-summary
      - chart-images
    simple:
      cache-specs:
        districts: expireAfterWrite=1h
        district-performance: expireAfterWrite=1h
        dashboard-summary: expireAfterWrite=1h
        chart-images: expireAfterWrite=1h

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.gov.dashboard: INFO
    org.springframework.cache: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/janmanrega.log

app:
  csv:
    directory: ${CSV_DIRECTORY:C:\\Users\\Lakshmi Makkena\\Desktop\\Gov Project\\Gov Data CSV's}
  cache:
    ttl: 3600