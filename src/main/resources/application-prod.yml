spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:janmanrega}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    
  thymeleaf:
    cache: true
    
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1h

server:
  port: ${PORT:8080}
  
logging:
  level:
    com.gov.dashboard: WARN
    org.springframework: WARN
  file:
    name: /var/log/janmanrega/application.log

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  csv:
    directory: ${CSV_DIRECTORY:/opt/janmanrega/data}
